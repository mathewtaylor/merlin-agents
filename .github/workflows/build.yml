name: build

on:
  # Feature branches build too. The Windows job is the ONLY way to get a NativeAOT binary — it
  # cannot be published from a developer machine — so restricting it to main would mean opening a
  # pull request just to obtain something to test with.
  push:
    branches: [main, 'feature/**']
    # A `v*` tag builds and then publishes. Releasing through the SAME workflow rather than a
    # separate one is deliberate: the bytes attached to the release are the bytes the Windows job
    # built and tested, not a second build of the same commit that nobody exercised.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The platform-neutral core builds and tests anywhere. Kept as its own job so a contributor on
  # macOS or Linux gets fast feedback on the logic that decides what counts as "not observed" —
  # which is the part most worth testing and the part that needs no Windows at all.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/Merlin.Agent.Core --configuration Release
      - run: dotnet test tests/Merlin.Agent.Core.Tests --configuration Release --logger "console;verbosity=normal"

  # NativeAOT needs the target platform's toolchain, so the shippable binary is only ever produced
  # here. Publishing from a developer machine is not possible and is not meant to be.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build --configuration Release
      - run: dotnet test tests/Merlin.Agent.Core.Tests --configuration Release
      - name: Publish (NativeAOT)
        run: >
          dotnet publish src/Merlin.Agent
          --configuration Release --runtime win-x64 --self-contained
          --output artifacts/win-x64
      - name: Package
        shell: pwsh
        run: |
          $out = "artifacts/win-x64"
          # The manifest must travel WITH the binary: the agent refuses to run without it rather
          # than inventing queries, so a package missing it would fail on every machine.
          if (-not (Test-Path "$out/queries/windows.json")) {
            New-Item -ItemType Directory -Path "$out/queries" -Force | Out-Null
            Copy-Item packaging/queries/windows.json "$out/queries/windows.json"
          }
          Compress-Archive -Path "$out/*" -DestinationPath artifacts/merlin-agent-win-x64.zip -Force
          $hash = (Get-FileHash artifacts/merlin-agent-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "SHA-256: $hash"
          # The install script pins this value, so it is surfaced as a build output rather than
          # left for somebody to compute by hand.
          $hash | Out-File artifacts/merlin-agent-win-x64.zip.sha256 -NoNewline
      - uses: actions/upload-artifact@v4
        with:
          name: merlin-agent-win-x64
          path: |
            artifacts/merlin-agent-win-x64.zip
            artifacts/merlin-agent-win-x64.zip.sha256

  # Publishes the tested package as a GitHub release asset. Only on a `v*` tag.
  #
  # This exists because the installer downloads the agent ANONYMOUSLY, from a customer's machine,
  # with no credentials — so an Actions artifact cannot serve it: those need auth, expire, and have
  # no stable address. A public release asset is the only thing `Invoke-WebRequest` can reach.
  release:
    needs: [core, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # The one job that writes. The workflow default stays `contents: read`.
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: merlin-agent-win-x64
          path: artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          SHA=$(cat artifacts/merlin-agent-win-x64.zip.sha256)

          # Re-derive the hash here rather than trusting the file that travelled with the zip: the
          # value an operator pastes into Merlin is what every machine in the fleet verifies
          # against, so it is checked against the artifact as downloaded, not as reported.
          ACTUAL=$(sha256sum artifacts/merlin-agent-win-x64.zip | cut -d' ' -f1)
          if [ "$SHA" != "$ACTUAL" ]; then
            echo "Recorded hash $SHA does not match the artifact ($ACTUAL). Refusing to publish."
            exit 1
          fi

          # The URL is VERSION-PINNED, never /releases/latest/download/. Merlin pins the SHA-256
          # alongside the address, so a floating URL would mean the next release breaks every
          # install with a hash mismatch. The two values move together, by design — publishing a
          # release is therefore also an instruction to update both.
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/merlin-agent-win-x64.zip"

          cat > notes.md <<EOF
          Windows agent, \`win-x64\`, NativeAOT and self-contained.

          ## Merlin configuration

          Set these on the Merlin deployment that will receive the reports:

          | Setting | Value |
          | --- | --- |
          | \`Merlin:Endpoints:AgentVersion\` | \`${TAG}\` |
          | \`Merlin:Endpoints:AgentPackageEndpoint\` | \`${URL}\` |
          | \`Merlin:Endpoints:AgentSha256\` | \`${SHA}\` |

          The installer refuses to serve without the address and the hash together — a script that
          downloads an unpinned binary is worse than no script.

          ## Verify

          \`\`\`
          sha256sum merlin-agent-win-x64.zip
          ${SHA}
          \`\`\`

          The binary is **not** Authenticode-signed, so Windows SmartScreen will warn on first run.
          EOF

          gh release create "$TAG" \
            artifacts/merlin-agent-win-x64.zip \
            artifacts/merlin-agent-win-x64.zip.sha256 \
            --title "$TAG" \
            --notes-file notes.md
